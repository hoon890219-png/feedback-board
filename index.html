<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앱 피드백 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 모바일은 한 컬럼 + 하단 탭바, PC(900px~)는 좌측 사이드바(이름·탭·요약) + 우측 본문. 큰 제목과 둥근 흰 카드 위주. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #f2f4f6;
  --ink: #191f28;
  --ink-2: #6b7684;
  --ink-3: #8b95a1;
  --line: #e5e8eb;
  --accent: #3182f6;
  --accent-soft: #e8f3ff;
  --accent-ink: #ffffff;
  --done: #00b386;
  --doing: #3182f6;
  --hold: #8b95a1;
  --danger: #f04452;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101013; --surface: #1b1c21; --surface-2: #26272d; --ink: #f2f4f6; --ink-2: #a2a9b3; --ink-3: #7a8290; --line: #2c2e35;
    --accent: #4593fc; --accent-soft: #1e2b3f; --accent-ink: #ffffff; --done: #2fd0a4; --doing: #4593fc; --hold: #7a8290; --danger: #ff6b76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101013; --surface: #1b1c21; --surface-2: #26272d; --ink: #f2f4f6; --ink-2: #a2a9b3; --ink-3: #7a8290; --line: #2c2e35;
  --accent: #4593fc; --accent-soft: #1e2b3f; --accent-ink: #ffffff; --done: #2fd0a4; --doing: #4593fc; --hold: #7a8290; --danger: #ff6b76;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; letter-spacing: -0.01em;
  padding-top: 8px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:is(button, input, select, textarea, summary, a):focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 0; box-shadow: 0 0 0 2px var(--accent); }

.shell { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.brand { font-size: 15px; font-weight: 700; color: var(--ink-2); padding: 14px 4px 0; }
.content { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* 탭 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs a { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; color: var(--ink-3); text-decoration: none; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
.side-stat { display: none; }

/* PC */
@media (min-width: 900px) {
  body { padding-bottom: 64px; padding-top: 40px; }
  .shell { max-width: 1040px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; }
  aside.side { position: sticky; top: 40px; display: flex; flex-direction: column; gap: 20px; }
  .brand { font-size: 20px; color: var(--ink); padding: 0 8px; }
  nav.tabs { position: static; flex-direction: column; background: none; border: 0; padding: 0; gap: 2px; }
  nav.tabs a { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 12px 14px; font-size: 16px; color: var(--ink-2); }
  nav.tabs a:hover { background: var(--surface); }
  nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); }
  nav.tabs a[aria-current="page"] svg { color: var(--accent); }
  .side-stat { display: block; }
}

/* 공통 */
.card { background: var(--surface); border-radius: 20px; padding: 20px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px; padding: 0 20px; height: 48px; font-weight: 700; cursor: pointer; }
.btn { flex: none; white-space: nowrap; }
.btn:active { filter: brightness(.92); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.small { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.plain { background: var(--surface-2); color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: default; }
.in { background: var(--surface-2); border: 0; border-radius: 14px; padding: 0 16px; height: 48px; width: 100%; min-width: 0; }
textarea.in { height: auto; min-height: 76px; padding: 12px 16px; resize: vertical; }
select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.in::placeholder { color: var(--ink-3); }

.hero { padding: 24px 4px 4px; display: flex; flex-direction: column; gap: 6px; }
.hero h2 { font-size: 26px; line-height: 1.35; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.hero h2 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--ink-2); font-size: 15px; }
@media (min-width: 900px) { .hero { padding-top: 0; } .hero h2 { font-size: 32px; } }

/* 입력 */
.quick { display: flex; flex-direction: column; gap: 10px; }
.quick .r1 { display: flex; gap: 8px; }
.quick .r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 480px) { .quick .r2 { grid-template-columns: 1fr; } }
.quick-more { display: flex; flex-direction: column; gap: 8px; }

/* 필터 */
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .filters { margin: 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; } }
.fchip { flex: none; border: 0; background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0 16px; height: 38px; font-weight: 500; font-size: 15px; cursor: pointer; white-space: nowrap; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.fchip b { font-weight: 700; margin-left: 6px; opacity: .6; }

/* 목록 */
.list { background: var(--surface); border-radius: 20px; padding: 8px; display: flex; flex-direction: column; }
.item { border-radius: 14px; }
.item-row { display: flex; gap: 14px; padding: 14px 12px; align-items: flex-start; }
.ck { flex: none; width: 28px; height: 28px; border: 2px solid var(--line); border-radius: 50%; background: var(--surface); padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--accent-ink); }
.ck:disabled { cursor: default; }
.ck svg { width: 14px; height: 14px; opacity: 0; }
.item.done .ck { background: var(--done); border-color: var(--done); }
.item.done .ck svg { opacity: 1; }
.item.doing .ck { border-color: var(--doing); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.title { font-weight: 500; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.item.done .title { color: var(--ink-3); text-decoration: line-through; }
.sub { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-3); }
.appchip { background: var(--surface-2); color: var(--ink-2); border-radius: 6px; padding: 1px 8px; font-weight: 500; }
.badge { font-weight: 700; color: var(--bc); }
.has-reply { color: var(--accent); font-weight: 500; }
.more { padding: 0 12px 16px 54px; display: flex; flex-direction: column; gap: 10px; }
.detail { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); font-size: 15px; }
.reply { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply small { display: block; color: var(--accent); font-weight: 700; font-size: 12px; margin-bottom: 2px; }
.adm { display: flex; flex-direction: column; gap: 8px; }
.adm .row { display: flex; gap: 8px; flex-wrap: wrap; }
.adm select { width: auto; flex: 1 1 120px; height: 40px; }
.done-toggle { align-self: flex-start; background: none; border: 0; color: var(--ink-2); font-weight: 500; cursor: pointer; padding: 8px 4px; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 16px; font-size: 15px; }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
@media (min-width: 900px) { .item:hover { background: var(--surface-2); } }

/* 앱 */
.app-list { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .app-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.app { display: flex; flex-direction: column; gap: 14px; }
.app h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.app .tg { color: var(--ink-2); font-size: 15px; overflow-wrap: anywhere; }
.app a.link { font-size: 14px; color: var(--accent); overflow-wrap: anywhere; text-decoration: none; }
.pct { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.pct small { font-size: 15px; color: var(--ink-2); font-weight: 500; margin-left: 6px; }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); display: flex; overflow: hidden; }
.meter i { display: block; height: 100%; }
.m-done { background: var(--done); } .m-doing { background: var(--doing); opacity: .45; }
.app-stats { display: flex; gap: 16px; font-size: 14px; color: var(--ink-2); }
.app-stats b { color: var(--ink); font-weight: 700; margin-left: 4px; }
.app-actions { display: flex; gap: 8px; margin-top: auto; }
.app-actions .btn { flex: 1; }
.add-app { display: flex; flex-direction: column; gap: 10px; }
.add-app h3 { font-size: 17px; }
.side-stat .card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.side-stat .lbl { color: var(--ink-2); font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: #333d4b; color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 15px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }
@media (min-width: 900px) { .toast { bottom: 32px; } }
@media (prefers-reduced-motion: no-preference) { .meter i { transition: width .4s; } .btn, .fchip, .item { transition: background-color .15s, filter .15s; } }
.admin-bar { display: flex; justify-content: center; padding: 8px 0 0; }
.link-btn { background: none; border: 0; color: var(--ink-3); font-size: 13px; cursor: pointer; padding: 8px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.login { display: flex; flex-direction: column; gap: 10px; }
.setup { max-width: 560px; margin: 80px auto; }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <p class="brand">앱 피드백</p>
    <nav class="tabs" aria-label="페이지">
      <a href="#todo" id="tab-todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>수정 요청</a>
      <a href="#apps" id="tab-apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>앱 목록</a>
    </nav>
    <div class="side-stat" id="side-stat"></div>
  </aside>

  <div class="content">
    <!-- 1. 수정 요청 -->
    <main id="page-todo" class="content">
      <div class="hero" id="hero"></div>
      <form class="card quick" id="quick" autocomplete="off">
        <div class="r1">
          <input class="in" id="q-title" maxlength="120" placeholder="고쳤으면 하는 점을 적어주세요" aria-label="수정 요청 내용" required>
          <button class="btn" type="submit" id="q-submit">추가</button>
        </div>
        <div class="r2">
          <select class="in" id="q-app" aria-label="대상 앱"></select>
          <input class="in" id="q-name" maxlength="30" placeholder="이름 (선택)" aria-label="이름">
        </div>
        <input class="in" id="q-detail" maxlength="800" placeholder="자세한 설명 (선택)" aria-label="자세한 설명">
        <input class="hp" id="q-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </form>
      <div class="filters" id="filters" role="group" aria-label="앱별 보기"></div>
      <div id="todo"></div>
    </main>

    <!-- 2. 앱 목록 -->
    <main id="page-apps" class="content" hidden>
      <div class="hero" id="hero-apps"></div>
      <div class="card add-app" id="add-app" hidden>
        <h3>앱 추가</h3>
        <input class="in" id="a-name" maxlength="40" placeholder="앱 이름" aria-label="앱 이름">
        <input class="in" id="a-tag" maxlength="80" placeholder="한 줄 소개 (선택)" aria-label="한 줄 소개">
        <input class="in" id="a-url" type="url" placeholder="설치·접속 링크 (선택)" aria-label="링크">
        <button class="btn" type="button" id="a-add">추가하기</button>
      </div>
      <div class="app-list" id="apps"></div>
    </main>
  </div>
</div>
<div class="admin-bar">
  <button class="link-btn" id="admin-toggle" type="button">개발자 로그인</button>
</div>
<form class="card login" id="login" hidden autocomplete="on" style="max-width:360px;margin:12px auto">
  <h3>개발자 로그인</h3>
  <input class="in" id="l-email" type="email" placeholder="이메일" autocomplete="username" required>
  <input class="in" id="l-pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <button class="btn" type="submit">로그인</button>
</form>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var STATUS = {
    new: { label: "대기", color: "var(--ink-3)" },
    doing: { label: "진행 중", color: "var(--doing)" },
    done: { label: "완료", color: "var(--done)" },
    hold: { label: "보류", color: "var(--hold)" }
  };
  var $ = function (id) { return document.getElementById(id); };
  var state = { apps: [], feedback: [], filterApp: "", isAdmin: false, open: {}, drafts: {}, showDone: false, mine: [] };
  var cfg = window.APP_CONFIG || {};
  var sb = null;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return el;
  }
  var toastT;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2800); }
  function fmtDate(iso) { try { var d = new Date(iso); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; } catch (e) { return ""; } }
  function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function statusOf(f) { return f.status || "new"; }
  function appName(id) { for (var i = 0; i < state.apps.length; i++) if (state.apps[i].id === id) return state.apps[i].name; return "삭제된 앱"; }
  try { state.mine = JSON.parse(load("fbboard-mine", "[]")); } catch (e) { state.mine = []; }

  /* ---------- 데이터 ---------- */
  function fetchAll() {
    return Promise.all([
      sb.from("apps").select("*").order("created_at", { ascending: true }),
      sb.from("feedback").select("*").order("created_at", { ascending: false })
    ]).then(function (r) {
      if (r[0].error || r[1].error) throw (r[0].error || r[1].error);
      return { apps: r[0].data || [], feedback: r[1].data || [] };
    });
  }
  function refresh(quiet) {
    return fetchAll().then(function (d) {
      var changed = JSON.stringify(d) !== JSON.stringify({ apps: state.apps, feedback: state.feedback });
      if (!changed) return;
      state.apps = d.apps; state.feedback = d.feedback;
      if (state.filterApp && !state.apps.some(function (a) { return a.id === state.filterApp; })) state.filterApp = "";
      fillSelect();
      var ae = document.activeElement;
      if (quiet && ae && ae.closest && ae.closest(".more")) return; // 답변 입력 중에는 화면을 다시 그리지 않음
      render();
    }).catch(function () { if (!quiet) toast("데이터를 불러오지 못했어요."); });
  }
  function updateFeedback(f, patch) {
    patch.updated_at = new Date().toISOString();
    return sb.from("feedback").update(patch).eq("id", f.id).then(function (r) {
      if (r.error) { toast("저장하지 못했어요. 다시 로그인해보세요."); throw r.error; }
      return refresh();
    });
  }

  /* ---------- 라우팅 ---------- */
  function route() {
    var page = location.hash === "#apps" ? "apps" : "todo";
    $("page-todo").hidden = page !== "todo"; $("page-apps").hidden = page !== "apps";
    $("tab-todo").setAttribute("aria-current", page === "todo" ? "page" : "false");
    $("tab-apps").setAttribute("aria-current", page === "apps" ? "page" : "false");
  }
  window.addEventListener("hashchange", route);

  function hero(el, parts, sub) {
    el.textContent = "";
    el.appendChild(h("h2", {}, parts));
    if (sub) el.appendChild(h("p", { text: sub }));
  }

  function renderFilters() {
    var box = $("filters"); box.textContent = "";
    var openCount = function (id) { return state.feedback.filter(function (f) { return (!id || f.app_id === id) && statusOf(f) !== "done" && statusOf(f) !== "hold"; }).length; };
    var mk = function (id, name) {
      return h("button", { class: "fchip", type: "button", "aria-pressed": String(state.filterApp === id), onclick: function () { state.filterApp = id; if (id) $("q-app").value = id; render(); } }, [name, h("b", { text: String(openCount(id)) })]);
    };
    box.appendChild(mk("", "전체"));
    state.apps.forEach(function (a) { box.appendChild(mk(a.id, a.name)); });
  }

  var CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg>';
  function item(f) {
    var st = statusOf(f);
    var ck = h("button", { class: "ck", type: "button", disabled: !state.isAdmin, "aria-label": st === "done" ? "완료 취소" : "완료로 표시", title: state.isAdmin ? "" : "개발자만 완료 처리할 수 있어요", onclick: function (e) {
      e.stopPropagation(); updateFeedback(f, { status: st === "done" ? "new" : "done" }).catch(function () {});
    } });
    ck.innerHTML = CHECK;
    var isMine = state.mine.indexOf(f.id) >= 0;
    var sub = [h("span", { class: "appchip", text: appName(f.app_id) })];
    if (st === "doing" || st === "hold") sub.push(h("span", { class: "badge", style: "--bc:" + STATUS[st].color, text: STATUS[st].label }));
    sub.push(h("span", { text: (f.author_name || "익명") + (isMine ? " (나)" : "") + " · " + fmtDate(f.created_at) }));
    if (f.note) sub.push(h("span", { class: "has-reply", text: "답변 도착" }));
    var open = !!state.open[f.id];
    function toggle() { state.open[f.id] = !state.open[f.id]; render(); }
    var main = h("div", { class: "main", role: "button", tabindex: "0", "aria-expanded": String(open), onclick: toggle, onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } } },
      [h("span", { class: "title", text: f.title }), h("div", { class: "sub" }, sub)]);
    var kids = [h("div", { class: "item-row" }, [ck, main])];
    if (open) {
      var more = [];
      if (f.detail) more.push(h("p", { class: "detail", text: f.detail }));
      if (f.note) more.push(h("div", { class: "reply" }, [h("small", { text: "개발자 답변 · " + fmtDate(f.updated_at) }), f.note]));
      if (!f.detail && !f.note && !state.isAdmin) more.push(h("p", { class: "detail", text: "추가 설명이 없어요." }));
      if (state.isAdmin) more.push(adminBox(f, st));
      kids.push(h("div", { class: "more" }, more));
    }
    return h("div", { class: "item " + st }, kids);
  }
  function adminBox(f, st) {
    var sel = h("select", { class: "in", "aria-label": "상태" }, Object.keys(STATUS).map(function (k) { return h("option", { value: k, text: STATUS[k].label, selected: k === st }); }));
    var ta = h("textarea", { class: "in", placeholder: "진행 상황이나 답변을 남겨주세요", oninput: function () { state.drafts[f.id] = ta.value; } });
    ta.value = state.drafts[f.id] != null ? state.drafts[f.id] : (f.note || "");
    var sv = h("button", { class: "btn small", type: "button", onclick: function () {
      sv.disabled = true;
      updateFeedback(f, { status: sel.value, note: ta.value.trim() }).then(function () { delete state.drafts[f.id]; toast("저장했어요"); }).catch(function () {}).then(function () { sv.disabled = false; });
    } }, ["저장"]);
    var del = h("button", { class: "btn small plain", type: "button", onclick: function () {
      if (del.dataset.arm !== "1") { del.dataset.arm = "1"; del.textContent = "정말 삭제?"; setTimeout(function () { del.dataset.arm = ""; del.textContent = "삭제"; }, 3000); return; }
      sb.from("feedback").delete().eq("id", f.id).then(function (r) { if (r.error) toast("삭제하지 못했어요."); else refresh(); });
    } }, ["삭제"]);
    return h("div", { class: "adm" }, [h("div", { class: "row" }, [sel, sv, del]), ta]);
  }

  function renderTodo() {
    var box = $("todo"); box.textContent = "";
    var all = state.feedback.filter(function (f) { return !state.filterApp || f.app_id === state.filterApp; });
    var openL = all.filter(function (f) { return statusOf(f) !== "done"; });
    var doneL = all.filter(function (f) { return statusOf(f) === "done"; });
    var scope = state.filterApp ? appName(state.filterApp) : "모든 앱";
    if (!openL.length) hero($("hero"), [all.length ? "남은 수정 요청이 없어요" : "첫 수정 요청을 기다리고 있어요"], scope);
    else hero($("hero"), ["처리할 요청이 ", h("em", { text: openL.length + "건" }), " 있어요"], scope + (doneL.length ? " · 완료 " + doneL.length + "건" : ""));
    if (!state.apps.length) {
      box.appendChild(h("div", { class: "list" }, [h("div", { class: "empty" }, [h("b", { text: "아직 등록된 앱이 없어요" }), state.isAdmin ? "'앱 목록' 탭에서 앱을 먼저 등록해주세요." : "앱이 등록되면 요청을 남길 수 있어요."])]));
      return;
    }
    if (!openL.length) {
      box.appendChild(h("div", { class: "list" }, [h("div", { class: "empty" }, [h("b", { text: all.length ? "모두 반영됐어요" : "아직 요청이 없어요" }), all.length ? "새로운 의견을 기다리고 있어요." : "위 입력칸에 첫 요청을 적어주세요."])]));
    } else box.appendChild(h("div", { class: "list" }, openL.map(item)));
    if (doneL.length) {
      box.appendChild(h("button", { class: "done-toggle", type: "button", onclick: function () { state.showDone = !state.showDone; render(); } }, ["완료 " + doneL.length + "건 " + (state.showDone ? "접기" : "보기")]));
      if (state.showDone) box.appendChild(h("div", { class: "list" }, doneL.map(item)));
    }
  }

  function stats(list) {
    var c = { new: 0, doing: 0, done: 0, hold: 0 };
    list.forEach(function (f) { c[statusOf(f)]++; });
    c.total = list.length - c.hold;
    c.pct = c.total ? Math.round(c.done / c.total * 100) : 0;
    return c;
  }
  function renderApps() {
    var box = $("apps"); box.textContent = "";
    hero($("hero-apps"), ["앱 ", h("em", { text: state.apps.length + "개" }), "를 만들고 있어요"], "앱을 누르면 그 앱의 수정 요청만 볼 수 있어요.");
    if (!state.apps.length) {
      box.appendChild(h("div", { class: "card empty", style: "grid-column:1/-1" }, [h("b", { text: "아직 등록된 앱이 없어요" }), state.isAdmin ? "위에서 첫 앱을 추가해보세요." : "앱이 등록되면 여기에 표시돼요."]));
      return;
    }
    state.apps.forEach(function (a) {
      var c = stats(state.feedback.filter(function (f) { return f.app_id === a.id; }));
      var pct = function (n) { return c.total ? (n / c.total * 100) + "%" : "0%"; };
      var kids = [
        h("div", {}, [h("h3", { text: a.name }), a.tagline ? h("p", { class: "tg", text: a.tagline }) : null]),
        h("div", { class: "pct" }, [c.pct + "%", h("small", { text: "반영됨" })]),
        h("div", { class: "meter", role: "img", "aria-label": "완료 " + c.done + " / " + c.total }, [h("i", { class: "m-done", style: "width:" + pct(c.done) }), h("i", { class: "m-doing", style: "width:" + pct(c.doing) })]),
        h("div", { class: "app-stats" }, [h("span", {}, ["완료", h("b", { text: String(c.done) })]), h("span", {}, ["진행 중", h("b", { text: String(c.doing) })]), h("span", {}, ["대기", h("b", { text: String(c.new) })])])
      ];
      if (/^https?:\/\//i.test(a.url || "")) kids.push(h("a", { class: "link", href: a.url, target: "_blank", rel: "noopener noreferrer", text: "앱 열어보기 ↗" }));
      var acts = [h("button", { class: "btn soft small", type: "button", onclick: function () { state.filterApp = a.id; $("q-app").value = a.id; location.hash = "#todo"; render(); window.scrollTo(0, 0); } }, ["요청 보기"])];
      if (state.isAdmin) {
        var del = h("button", { class: "btn small plain", type: "button", onclick: function () {
          if (del.dataset.arm !== "1") { del.dataset.arm = "1"; del.textContent = "요청까지 삭제?"; setTimeout(function () { del.dataset.arm = ""; del.textContent = "삭제"; }, 3000); return; }
          sb.from("apps").delete().eq("id", a.id).then(function (r) { if (r.error) toast("삭제하지 못했어요."); else refresh(); });
        } }, ["삭제"]);
        acts.push(del);
      }
      kids.push(h("div", { class: "app-actions" }, acts));
      box.appendChild(h("article", { class: "card app" }, kids));
    });
  }

  function renderSide() {
    var c = stats(state.feedback);
    var s = $("side-stat"); s.textContent = "";
    s.appendChild(h("div", { class: "card" }, [
      h("span", { class: "lbl", text: "전체 반영률" }),
      h("div", { class: "pct" }, [c.pct + "%"]),
      h("div", { class: "meter" }, [h("i", { class: "m-done", style: "width:" + (c.total ? c.done / c.total * 100 : 0) + "%" })]),
      h("span", { class: "lbl", text: c.done + " / " + c.total + "건 완료" })
    ]));
  }

  function fillSelect() {
    var sel = $("q-app"), prev = sel.value; sel.textContent = "";
    state.apps.forEach(function (a) { sel.appendChild(h("option", { value: a.id, text: a.name })); });
    sel.value = state.filterApp || prev || (state.apps[0] && state.apps[0].id) || "";
    if (!sel.value && state.apps[0]) sel.value = state.apps[0].id;
  }
  function render() {
    renderFilters(); renderTodo(); renderApps(); renderSide();
    $("add-app").hidden = !state.isAdmin;
    $("admin-toggle").textContent = state.isAdmin ? "개발자 로그아웃" : "개발자 로그인";
  }

  /* ---------- 입력 ---------- */
  $("q-name").value = load("fbboard-name", "");
  $("quick").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("q-title").value.trim(), appId = $("q-app").value;
    if (!appId) return toast("아직 등록된 앱이 없어요.");
    if (!title) return;
    if ($("q-hp").value) { $("q-title").value = ""; return toast("요청을 추가했어요"); } // 봇 차단용 숨은 칸
    var name = $("q-name").value.trim(); save("fbboard-name", name);
    var b = $("q-submit"); b.disabled = true;
    sb.from("feedback").insert({ app_id: appId, title: title, detail: $("q-detail").value.trim(), author_name: name }).select("id").single().then(function (r) {
      b.disabled = false;
      if (r.error) return toast(/too many/.test(r.error.message || "") ? "요청이 몰리고 있어요. 잠시 뒤 다시 시도해주세요." : "추가하지 못했어요. 잠시 뒤 다시 시도해주세요.");
      if (r.data && r.data.id) { state.mine.push(r.data.id); save("fbboard-mine", JSON.stringify(state.mine.slice(-200))); }
      $("q-title").value = ""; $("q-detail").value = ""; toast("요청을 추가했어요"); $("q-title").focus();
      refresh();
    });
  });
  $("a-add").addEventListener("click", function () {
    var name = $("a-name").value.trim(); if (!name) return $("a-name").focus();
    sb.from("apps").insert({ name: name, tagline: $("a-tag").value.trim(), url: $("a-url").value.trim() }).then(function (r) {
      if (r.error) return toast("추가하지 못했어요. 다시 로그인해보세요.");
      $("a-name").value = ""; $("a-tag").value = ""; $("a-url").value = ""; toast("앱을 추가했어요"); refresh();
    });
  });

  /* ---------- 개발자 로그인 ---------- */
  $("admin-toggle").addEventListener("click", function () {
    if (state.isAdmin) { sb.auth.signOut(); return; }
    $("login").hidden = !$("login").hidden;
    if (!$("login").hidden) $("l-email").focus();
  });
  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    sb.auth.signInWithPassword({ email: $("l-email").value.trim(), password: $("l-pw").value }).then(function (r) {
      if (r.error) return toast("이메일 또는 비밀번호를 확인해주세요.");
      $("l-pw").value = ""; $("login").hidden = true;
    });
  });
  function checkAdmin(session) {
    if (!session) { state.isAdmin = false; return Promise.resolve(); }
    return sb.rpc("is_admin").then(function (r) { state.isAdmin = !r.error && r.data === true; if (!state.isAdmin) toast("관리자 계정이 아니에요."); });
  }

  /* ---------- 시작 ---------- */
  route(); render();
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) {
    $("page-todo").hidden = false; $("page-apps").hidden = true;
    $("todo").appendChild(h("div", { class: "card setup" }, [h("h3", { text: "설정이 필요해요" }), h("p", { class: "detail", text: "config.js에 Supabase 주소와 키를 입력해주세요. README.md에 순서가 있어요." })]));
    $("q-submit").disabled = true;
    return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(function (_ev, session) { setTimeout(function () { checkAdmin(session).then(function () { render(); }); }, 0); });
  refresh();
  setInterval(function () { if (!document.hidden) refresh(true); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(true); });
})();
</script>

</body>
</html>
